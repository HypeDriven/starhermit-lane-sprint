<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a2b" />
<title>Lane Sprint</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="./css/style.css?v=2">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js?v=2"}}</script>
<script type="module" src="./src/index.js?v=2"></script>
</head>
<body>
<canvas id="game-canvas" tabindex="0" aria-label="Lane Sprint road view"></canvas>

<header id="hud" aria-label="Status">
  <div class="hud-row">
    <p class="hud-item"><span class="hud-label">Stage</span><span id="hud-stage">—</span></p>
    <p class="hud-item"><span class="hud-label">Score</span><span id="hud-score">0</span></p>
    <p class="hud-item"><span class="hud-label">Speed</span><span id="hud-speed">0 km/h</span></p>
    <p class="hud-item"><span id="hud-boost" data-state="ready">—</span></p>
    <p class="hud-item hud-player-item">
      <span class="hud-label" id="hud-player-label">Player</span>
      <span id="hud-player">—</span>
      <span id="hud-sync" class="sync-badge" data-state="offline"></span>
    </p>
    <button id="btn-pause" type="button" data-action="toggle-pause">Pause</button>
  </div>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span id="hud-progress-label" class="sr-only">Progress</span>
    <span id="hud-progress-bar"></span>
  </div>
  <ol id="hud-lanes" aria-label="Lanes"></ol>
</header>

<p id="banner" hidden></p>

<div id="overlay" hidden>
  <section id="title-screen" class="screen" aria-label="Title"></section>
  <section id="results-screen" class="screen" aria-label="Results" hidden></section>
  <section id="help-screen" class="screen" aria-label="How to play" hidden></section>
  <section id="settings-screen" class="screen" aria-label="Settings" hidden></section>
  <section id="pause-screen" class="screen" aria-label="Paused" hidden></section>
</div>

<nav id="touch-controls" aria-label="Driving controls" hidden></nav>

<p id="live-region" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
